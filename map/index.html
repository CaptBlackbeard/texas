<style>

  header h1{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0;color:var(--wine);
            line-height:1.1}

  .back:hover{color:var(--terracotta)}
  .spacer{flex:1 1 auto}
  .cities{display:flex;gap:.4rem}

  .legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:.5rem 1.1rem;align-items:center;
          padding:.65rem 16px calc(.65rem + env(safe-area-inset-bottom,0px));
          border-top:1px solid var(--rule);background:var(--surface);font-size:.92rem}
  .key{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer;user-select:none}
  .key input{margin:0}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #FFFDF8;
       box-shadow:0 0 0 1px rgba(0,0,0,.25);display:inline-block}
  .hint{color:var(--ink-soft);font-style:italic;font-size:.88rem}
  .pin{border-radius:50%;border:2px solid #FFFDF8;box-shadow:0 1px 4px rgba(0,0,0,.45)}

  .dot.sq{border-radius:3px}
  .dot.ring{box-shadow:0 0 0 1px rgba(0,0,0,.25), inset 0 0 0 3px rgba(255,253,248,.92)}

  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:.7rem .85rem;font-family:var(--body);font-size:.95rem;line-height:1.45}
  .pop-n{font-family:var(--display);font-size:1.2rem;font-weight:600;color:var(--wine);display:block}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pop-n{color:#F3D9B8}}

  .pop-d{display:block;margin-top:.25rem}
  .pop-w{display:block;margin-top:.4rem;padding-top:.4rem;border-top:1px solid var(--rule);
         color:var(--olive);font-weight:500}
  .walkbtn{margin-top:.5rem;font-family:var(--display);font-size:.95rem;cursor:pointer;
    background:var(--wine);color:#FCF4E6;border:1px solid var(--gold);border-radius:999px;padding:.25rem .7rem}
  .panel{position:absolute;right:10px;top:10px;z-index:1000;max-width:230px;background:var(--surface);

         box-shadow:0 4px 14px rgba(0,0,0,.2)}

  .panel .close{float:right;cursor:pointer;color:var(--ink-soft);border:0;background:none;font-size:1rem}
  @media (max-width:560px){
    header h1{font-size:1.2rem;width:100%}
    .legend{font-size:.85rem;gap:.4rem .8rem}
    .panel{max-width:180px;font-size:.84rem}

</script>
<script>
(function(){
  var COL={hotel:"#221812",bbq:"#B5400F",kids:"#1F4E79",coffee:"#7A4A2A",beer:"#C98B1A",warhammer:"#4E6B4A"};
  var LABEL={hotel:"Hotel",bbq:"Barbecue",kids:"For kids",coffee:"Coffee",beer:"Beer",warhammer:"Warhammer"};
  var WALK=80; // metres per minute, an unhurried city pace
  var map=L.map("map",{zoomControl:true,scrollWheelZoom:true}).setView([30.2672,-97.7431],12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function metres(a,b){
    var R=6371000, t=Math.PI/180;
    var dLa=(b.lat-a.lat)*t, dLo=(b.lng-a.lng)*t;
    var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  var markers=[], circles=L.layerGroup().addTo(map), current=null;

  function popupHTML(p, from){
    var title = p.u ? '<a href="'+p.u+'" target="_blank" rel="noopener">'+p.n+'</a>' : p.n;
    var h='<span class="pop-n">'+title+'</span><span class="pop-a">'+LABEL[p.c]+(p.a?" &middot; "+p.a:"")+'</span>';
    if(p.d) h+='<span class="pop-d">'+p.d+'</span>';
    if(p.t) h+='<span class="pop-d"><a href="'+p.t+'" target="_blank" rel="noopener">reviews on Tripadvisor</a></span>';
    if(from && from!==p){
      var m=metres(from,p);
      h+='<span class="pop-w">'+Math.round(m)+' m from '+from.n+' &mdash; about '+Math.max(1,Math.round(m/WALK))+' min on foot</span>';
    }
    if(p.c==="hotel") h+='<button class="walkbtn" type="button" data-walk="'+p.n+'">walking circles from here</button>';
    return h;
  }
  function redrawPopups(){
    markers.forEach(function(m){ m.setPopupContent(popupHTML(m.place, current)); });
  }
  function showPanel(p){
    hidePanel();
    var near={5:0,10:0,15:0}, closest=null, closestMin=1e9;
    PLACES.forEach(function(q){
      if(q===p || q.c==="hotel" || q.c==="warhammer" || q.city!==p.city) return;
      var mins=metres(p,q)/WALK;
      if(mins<closestMin){ closestMin=mins; closest=q; }
      if(mins<=5) near[5]++; if(mins<=10) near[10]++; if(mins<=15) near[15]++;
    });
    var d=L.DomUtil.create("div","panel"); d.id="walkpanel";
    d.innerHTML='<button class="close" type="button" aria-label="Close">&times;</button>'+
      '<b>'+p.n+'</b><br>Within a walk of:<br>'+
      '&bull; 5 min &mdash; '+near[5]+' places<br>'+
      '&bull; 10 min &mdash; '+near[10]+' places<br>'+
      '&bull; 15 min &mdash; '+near[15]+' places<br>'+
      (closest ? '<span class="pop-a">nearest: '+closest.n+', about '+Math.max(1,Math.round(closestMin))+' min</span><br>' : '')+
      '<span class="hint">Circles are straight-line; streets add a little.</span>';
    document.getElementById("map").appendChild(d);
    L.DomEvent.disableClickPropagation(d);
    d.querySelector(".close").addEventListener("click",function(){hidePanel();circles.clearLayers();current=null;redrawPopups();});
  }
  function hidePanel(){ var e=document.getElementById("walkpanel"); if(e) e.remove(); }
  function drawWalk(p){
    circles.clearLayers(); current=p;
    [[5,.30],[10,.20],[15,.12]].forEach(function(pair){
      L.circle([p.lat,p.lng],{radius:pair[0]*WALK,color:"#6B7A4F",weight:1,
        fillColor:"#6B7A4F",fillOpacity:pair[1],interactive:false}).addTo(circles);
    });
    showPanel(p); redrawPopups();
    map.fitBounds(L.latLng(p.lat,p.lng).toBounds(15*WALK*2.4),{padding:[20,20]});
  }
  PLACES.forEach(function(p){
    var size=p.c==="hotel"?19:13;
    var icon=L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
      html:'<div class="pin '+p.c+'" style="width:'+size+'px;height:'+size+'px;background:'+COL[p.c]+'"></div>'});
    var m=L.marker([p.lat,p.lng],{icon:icon,title:p.n,riseOnHover:true}).addTo(map);
    m.place=p; m.bindPopup(popupHTML(p,null),{maxWidth:260});
    m.on("popupopen",function(e){
      var b=e.popup.getElement().querySelector("[data-walk]");
      if(b) b.addEventListener("click",function(){ drawWalk(p); });
    });
    markers.push(m);
  });
  function bounds(city){
    var pts=markers.filter(function(m){return m.place.city===city;}).map(function(m){return m.getLatLng();});
    return L.latLngBounds(pts);
  }
  function go(city){
    circles.clearLayers(); hidePanel(); current=null; redrawPopups();
    map.flyToBounds(bounds(city),{padding:[30,30],duration:.8});
    document.querySelectorAll(".cities button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.city===city));
    });
  }
  document.querySelectorAll(".cities button").forEach(function(b){
    b.addEventListener("click",function(){ go(b.dataset.city); });
  });
  document.querySelectorAll(".legend input").forEach(function(cb){
    cb.addEventListener("change",function(){
      markers.forEach(function(m){
        if(m.place.c!==cb.dataset.cat) return;
        if(cb.checked) m.addTo(map); else map.removeLayer(m);
      });
    });
  });
  function select(p){
    document.querySelectorAll(".pin.sel").forEach(function(e){e.classList.remove("sel");});
    var mk=markers.filter(function(x){return x.place===p;})[0];
    if(mk && mk._icon){ var pin=mk._icon.querySelector(".pin"); if(pin) pin.classList.add("sel"); }
    return mk;
  }
  function fromHash(){
    var id=decodeURIComponent(location.hash.slice(1)); if(!id) return false;
    var mk=markers.filter(function(x){return x.place.id===id;})[0]; if(!mk) return false;
    var p=mk.place;
    document.querySelectorAll(".cities button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.city===p.city)); });
    drawWalk(p); select(p); setTimeout(function(){ mk.openPopup(); },350);
    return true;
  }
  if(!fromHash()) map.fitBounds(bounds("Austin"),{padding:[30,30]});
  window.addEventListener("hashchange",fromHash);
})();
</script>
